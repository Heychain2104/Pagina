<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SecuroNova — Discord Security</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Fondo animado -->
    <div class="background">
        <div class="orb orb-one"></div>
        <div class="orb orb-two"></div>
        <div class="orb orb-three"></div>

        <div class="grid"></div>
    </div>

    <!-- Contenido principal -->
    <main class="container">

        <!-- Texto superior -->
        <section class="hero">

            <div class="typing-container">
                <h1 id="typing-text"></h1>
                <span class="cursor"></span>
            </div>

            <p class="subtitle">
                The next security generation for Discord is right here
            </p>

        </section>

        <!-- Panel de Login -->
        <section class="login-card">

            <div class="card-glow"></div>

            <div class="logo">
                <div class="logo-symbol">S</div>
                <span>SecuroNova</span>
            </div>

            <div class="separator"></div>

            <h2>Welcome to SecuroNova</h2>

            <p class="description">
                Secure your Discord experience with next-generation
                security technology.
            </p>

            <button id="discord-login" class="discord-button">

                <span class="discord-icon">
                    <svg viewBox="0 0 24 24" aria-hidden="true">
                        <path
                            d="M19.54 0c1.2 0 2.17.97 2.17 2.17v19.66c0 1.2-.97 2.17-2.17 2.17H4.46c-1.2 0-2.17-.97-2.17-2.17V2.17C2.29.97 3.26 0 4.46 0h15.08ZM16.4 5.18a10.4 10.4 0 0 0-2.65-.81l-.33.67a9.77 9.77 0 0 0-2.84 0l-.33-.67c-.93.16-1.82.43-2.65.81-1.68 2.5-2.14 4.94-1.91 7.35a10.67 10.67 0 0 0 3.27 1.66l.79-1.08c-.43-.16-.84-.36-1.23-.59l.3-.23c2.37 1.1 4.93 1.1 7.27 0l.31.23c-.39.23-.8.43-1.24.59l.79 1.08a10.67 10.67 0 0 0 3.27-1.66c.27-2.79-.46-5.2-1.92-7.35ZM9.63 11.84c-.71 0-1.29-.66-1.29-1.47s.57-1.47 1.29-1.47c.72 0 1.3.66 1.29 1.47 0 .81-.57 1.47-1.29 1.47Zm4.74 0c-.71 0-1.29-.66-1.29-1.47s.57-1.47 1.29-1.47 1.3.66 1.29 1.47c0 .81-.57 1.47-1.29 1.47Z"
                        />
                    </svg>
                </span>

                <span>Login with Discord</span>

                <span class="arrow">→</span>

            </button>

            <div class="security-status">
                <span class="status-dot"></span>
                <span>SecuroNova security system online</span>
            </div>

            <p class="powered">
                Powered by SecuroNova
            </p>

        </section>

    </main>

    <script src="script.js"></script>

</body>
</html>
